<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Service Dept. | Service Call 001 Feedback</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --charcoal: #171717;
      --cream: #F0EEE9;
      --red: #D44A4A;
      --blue: #244B8F;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--charcoal);
      color: var(--cream);
      font-family: "DotGothic16", sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* HEADER */

    .site-header {
      width: 100%;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        8px;

      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .text-logo {
      color: var(--cream);
      font-size: 22px;
      line-height: 0.78;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* FORM */

    main {
      width: 100%;
    }

    .form-section {
      width: 100%;
      margin: 0;
      padding: 0;
      background: var(--charcoal);
    }

    .fillout-wrapper {
      width: 100%;
      min-height: 300px;
      margin: 0;
      padding: 0;
      overflow: visible;
    }

    /* FOOTER */

    footer {
      width: 100%;

      border-top:
        1px solid
        rgba(240, 238, 233, 0.14);

      padding:
        20px
        20px
        max(28px, env(safe-area-inset-bottom));

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 18px;

      color: var(--cream);

      font-size: 11px;
      letter-spacing: 0.04em;

      opacity: 0.55;
    }

    @media (max-width: 640px) {

      .site-header {
        padding:
          max(22px, env(safe-area-inset-top))
          18px
          4px;
      }

      .text-logo {
        font-size: 20px;
      }

      footer {
        padding:
          18px
          18px
          max(26px, env(safe-area-inset-bottom));

        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

    }

  </style>
</head>

<body>

  <header class="site-header">

    <div class="text-logo">
      SERVICE<br>
      DEPT.
    </div>

  </header>

  <main>

    <section class="form-section">

      <div class="fillout-wrapper">

        <div
          data-fillout-id="fC1y2kDPzGus"
          data-fillout-embed-type="standard"
          data-fillout-inherit-parameters
          data-fillout-dynamic-resize
          style="width:100%;"
        ></div>

      </div>

    </section>

  </main>

  <footer>

    <span>
      SERVICE DEPT. / BANGKOK
    </span>

    <span>
      EST. 2026
    </span>

  </footer>

  <script src="https://server.fillout.com/embed/v1/"></script>

</body>

</html>
