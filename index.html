<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Service Dept. | Service Call 001 Feedback</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --charcoal: #171717;
      --cream: #F0EEE9;
      --red: #D44A4A;
      --blue: #244B8F;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--charcoal);
      color: var(--cream);
      font-family: "DotGothic16", sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .site-header {
      width: 100%;
      padding:
        max(22px, env(safe-area-inset-top))
        22px
        0;
    }

    .logo {
      font-size: 20px;
      line-height: 0.9;
      text-transform: uppercase;
    }

    .hero {
      width: 100%;
      text-align: center;
      padding: 56px 20px 38px;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--red);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 10vw, 58px);
      font-weight: 400;
      line-height: 1.05;
    }

    .intro {
      max-width: 650px;
      margin: 26px auto 0;
      font-size: 16px;
      line-height: 1.7;
      opacity: 0.82;
    }

    .form-section {
      width: 100%;
      margin: 0 auto;
      padding: 0;
    }

    .fillout-wrapper {
      width: 100%;
      min-height: 300px;
      overflow: visible;
    }

    footer {
      width: 100%;
      border-top: 1px solid rgba(240, 238, 233, 0.14);
      padding:
        24px
        22px
        max(30px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      opacity: 0.65;
    }

    @media (max-width: 640px) {
      .site-header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero {
        padding: 44px 18px 30px;
      }

      .intro {
        font-size: 14px;
        line-height: 1.65;
      }

      footer {
        padding-left: 18px;
        padding-right: 18px;
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="logo">
      SERVICE<br>DEPT.
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">SERVICE CALL 001</div>

      <h1>POST-SERVICE REPORT</h1>

      <p class="intro">
        Your feedback helps us improve future Service Calls
        and decide what we build next.
      </p>
    </section>

    <section class="form-section">
      <div class="fillout-wrapper">
        <div
          data-fillout-id="fC1y2kDPzGus"
          data-fillout-embed-type="standard"
          data-fillout-inherit-parameters
          data-fillout-dynamic-resize
          style="width:100%;"
        ></div>
      </div>
    </section>
  </main>

  <footer>
    <span>SERVICE DEPT. / BANGKOK</span>
    <span>EST. 2026</span>
  </footer>

  <script src="https://server.fillout.com/embed/v1/"></script>

</body>
</html>
