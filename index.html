<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Service Dept. | Service Call 001 Feedback</title>

  <!-- DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ================================
       SERVICE DEPT. BRAND
       ================================ */

    :root {
      --charcoal: #171717;
      --cream: #F0EEE9;
      --red: #D44A4A;
      --blue: #244B8F;
    }


    /* ================================
       BASE
       ================================ */

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--charcoal);
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: var(--charcoal);
      color: var(--cream);

      font-family: "DotGothic16", sans-serif;

      overflow-x: hidden;
    }


    /* ================================
       HEADER
       ================================ */

    .site-header {
      width: 100%;

      padding:
        max(28px, env(safe-area-inset-top))
        32px
        0;

      position: relative;
      z-index: 10;
    }

    .logo {
      display: block;

      width: 125px;
      height: auto;

      object-fit: contain;
    }


    /* ================================
       HERO
       ================================ */

    .hero {
      width: 100%;

      text-align: center;

      padding:
        70px
        24px
        46px;
    }

    .eyebrow {
      margin: 0 0 16px;

      color: var(--red);

      font-size: 14px;
      font-weight: 400;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      color: var(--cream);

      font-size: clamp(34px, 5vw, 58px);
      font-weight: 400;

      line-height: 1.05;

      text-transform: uppercase;
    }

    .intro {
      width: 100%;
      max-width: 680px;

      margin:
        28px
        auto
        0;

      color: var(--cream);

      font-size: 16px;
      line-height: 1.7;

      opacity: 0.82;
    }


    /* ================================
       FORM
       ================================ */

    .form-section {
      width: 100%;

      margin: 0;
      padding: 0;

      background: var(--charcoal);
    }

    .fillout-wrapper {
      width: 100%;

      min-height: 300px;

      margin: 0;
      padding: 0;

      overflow: visible;
    }


    /* ================================
       FOOTER
       ================================ */

    footer {
      width: 100%;

      border-top:
        1px solid
        rgba(240, 238, 233, 0.14);

      padding:
        24px
        32px
        max(30px, env(safe-area-inset-bottom));

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      color: var(--cream);

      font-size: 12px;

      opacity: 0.6;
    }


    /* ================================
       MOBILE
       ================================ */

    @media (max-width: 640px) {

      .site-header {
        padding:
          max(22px, env(safe-area-inset-top))
          18px
          0;
      }

      .logo {
        width: 105px;
      }

      .hero {
        padding:
          48px
          18px
          34px;
      }

      .eyebrow {
        margin-bottom: 14px;

        font-size: 12px;
      }

      h1 {
        font-size: clamp(34px, 10vw, 48px);

        line-height: 1.08;
      }

      .intro {
        max-width: 520px;

        margin-top: 24px;

        font-size: 14px;
        line-height: 1.65;
      }

      footer {
        padding:
          20px
          18px
          max(28px, env(safe-area-inset-bottom));

        flex-direction: column;

        align-items: flex-start;

        gap: 6px;
      }
    }

  </style>
</head>


<body>

  <!-- ================================
       SERVICE DEPT. HEADER
       ================================ -->

  <header class="site-header">

    <img
      class="logo"
      src="SVD-04.png"
      alt="Service Dept."
    >

  </header>


  <!-- ================================
       CONTENT
       ================================ -->

  <main>

    <section class="hero">

      <div class="eyebrow">
        SERVICE CALL 001
      </div>

      <h1>
        POST-SERVICE REPORT
      </h1>

      <p class="intro">
        Your feedback helps us improve future Service Calls
        and decide what we build next.
      </p>

    </section>


    <!-- ==============================
         FILLOUT FORM
         ============================== -->

    <section class="form-section">

      <div class="fillout-wrapper">

        <div
          data-fillout-id="fC1y2kDPzGus"
          data-fillout-embed-type="standard"
          data-fillout-inherit-parameters
          data-fillout-dynamic-resize
          style="width: 100%;"
        ></div>

      </div>

    </section>

  </main>


  <!-- ================================
       FOOTER
       ================================ -->

  <footer>

    <span>
      SERVICE DEPT. / BANGKOK
    </span>

    <span>
      EST. 2026
    </span>

  </footer>


  <!-- Fillout Embed -->

  <script src="https://server.fillout.com/embed/v1/"></script>

</body>

</html>
